<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdOps Interview Kit</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="kit-header">
  <div class="kit-brand">
    <h1 class="kit-title">AdOps Interview Kit</h1>
    <p class="kit-subtitle">
      <span data-lang="pt">Guia de preparação para entrevistas em Ad Operations</span>
      <span data-lang="en" style="display:none">Interview preparation guide for Ad Operations</span>
      <span data-lang="es" style="display:none">Guía de preparación para entrevistas en Ad Operations</span>
    </p>
  </div>
  <div class="kit-divider"></div>
  <div class="kit-stats">
    <div class="stat"><span class="stat-num" id="stat-platforms">9</span><span class="stat-label">Plataformas</span></div>
    <div class="stat"><span class="stat-num" id="stat-questions">70+</span><span class="stat-label">Perguntas</span></div>
    <div class="stat"><span class="stat-num">3</span><span class="stat-label">Idiomas</span></div>
    <div class="stat"><span class="stat-num">3</span><span class="stat-label">Níveis</span></div>
  </div>
</header>

<!-- Barra unificada: idioma + busca + botões -->
<div class="control-bar" id="control-bar">
  <span class="lang-label">Idioma</span>
  <div class="lang-btns">
    <button class="lang-btn active" data-lang="pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
  </div>
  <div class="bar-divider"></div>
  <div class="bar-search">
    <span class="bar-search-icon">🔍</span>
    <input type="text" id="search-input" class="bar-search-input"
      placeholder="Buscar em todas as plataformas..."
      oninput="onSearchInput(this.value)"
      onkeydown="if(event.key==='Escape')clearSearch()" />
    <button class="bar-search-clear" id="search-clear" onclick="clearSearch()" style="display:none">✕</button>
  </div>
  <div class="bar-divider"></div>
  <div class="global-btns">
    <button class="global-btn quiz-mode-btn" id="btn-quiz" onclick="openQuizMenu()">🎓 Simulados</button>
    <button class="global-btn" id="btn-expand"   onclick="expandAll()">▼ Expandir tudo</button>
    <button class="global-btn" id="btn-collapse" onclick="collapseAll()">▲ Fechar tudo</button>
  </div>
</div>

<div class="search-status-bar" id="search-status"></div>

<nav class="platform-nav" id="platform-nav"></nav>

<main class="main">
  <div id="main-content"></div>
</main>

<script src="js/app.js"></script>
</body>
</html>

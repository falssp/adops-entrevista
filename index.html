<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdOps Interview Kit — Interview Prep & Certification Practice</title>

<!-- SEO -->
<meta name="description" content="Ad Operations knowledge base. 288 trilingual questions (PT/EN/ES) across 24 platforms + 340 real certification exam questions. CM360, DV360, Meta, GA4, TikTok, TTD and more.">
<meta name="keywords" content="ad operations, adops, certification, CM360, DV360, Meta Ads, Google Ads, programmatic, digital advertising, knowledge base">
<meta name="robots" content="index, follow">

<!-- Open Graph -->
<meta property="og:title" content="AdOps Interview Kit">
<meta property="og:description" content="288 questions + 340 certification exam questions across 24 ad platforms. Trilingual (PT/EN/ES).">
<meta property="og:type" content="website">
<meta property="og:url" content="https://falssp.github.io/adops-interview-kit">
<meta property="og:image" content="https://falssp.github.io/adops-interview-kit/og-image.svg">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AdOps Interview Kit">
<meta name="twitter:description" content="288 interview questions + 340 certification exam questions across 24 ad platforms. Free & open source.">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="kit-header">
  <div class="kit-brand">
    <h1 class="kit-title">AdOps Interview Kit</h1>
    <p class="kit-subtitle">
      <span data-lang="pt">Base de conhecimento em Ad Operations — 24 plataformas, trilíngue</span>
      <span data-lang="en" style="display:none">Ad Operations knowledge base — 24 platforms, trilingual</span>
      <span data-lang="es" style="display:none">Base de conocimiento en Ad Operations — 24 plataformas, trilingüe</span>
    </p>
  </div>
  <div class="kit-divider"></div>
  <div class="kit-stats">
    <div class="stat"><span class="stat-num" id="stat-platforms">24</span><span class="stat-label">Plataformas</span></div>
    <div class="stat"><span class="stat-num" id="stat-questions">288</span><span class="stat-label">Perguntas</span></div>
    <div class="stat"><span class="stat-num">3</span><span class="stat-label">Idiomas</span></div>
    <div class="stat"><span class="stat-num">3</span><span class="stat-label">Níveis</span></div>
  </div>
</header>

<!-- Barra unificada: idioma + busca + botões -->
<div class="control-bar" id="control-bar">
  <span class="lang-label">Idioma</span>
  <div class="lang-btns">
    <button class="lang-btn active" data-lang="pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
  </div>
  <div class="bar-divider"></div>
  <div class="bar-search">
    <span class="bar-search-icon">🔍</span>
    <input type="text" id="search-input" class="bar-search-input"
      placeholder="Buscar em todas as plataformas..."
      oninput="onSearchInput(this.value)"
      onkeydown="if(event.key==='Escape')clearSearch()" />
    <button class="bar-search-clear" id="search-clear" onclick="clearSearch()" style="display:none">✕</button>
  </div>
  <div class="bar-divider"></div>
  <div class="global-btns">
    <button class="global-btn quiz-mode-btn" id="btn-quiz" onclick="openQuizMenu()">🎓 Simulados</button>
    <button class="global-btn" id="btn-expand"   onclick="expandAll()">▼ Expandir tudo</button>
    <button class="global-btn" id="btn-collapse" onclick="collapseAll()">▲ Fechar tudo</button>
  </div>
</div>

<div class="search-status-bar" id="search-status"></div>

<nav class="platform-nav" id="platform-nav"></nav>

<main class="main">
  <div id="main-content"></div>
</main>

<script src="js/app.js?v=9"></script>

<!-- Content Protection -->
<script>
(function() {
  // Bloquear clique direito
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  // Bloquear seleção de texto por arrastar
  document.addEventListener('selectstart', function(e) { e.preventDefault(); });

  // Bloquear Ctrl+S, Ctrl+U (view source), Ctrl+Shift+I (devtools), F12
  document.addEventListener('keydown', function(e) {
    if (
      (e.ctrlKey && (e.key === 's' || e.key === 'S')) ||
      (e.ctrlKey && (e.key === 'u' || e.key === 'U')) ||
      (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')) ||
      e.key === 'F12'
    ) {
      e.preventDefault();
    }
  });

  // Bloquear drag de elementos
  document.addEventListener('dragstart', function(e) { e.preventDefault(); });

  // Copyright no console
  console.log('%c⛔ AdOps Interview Kit', 'color:#ef4444;font-size:20px;font-weight:bold');
  console.log('%c© 2025 Todos os direitos reservados. Uso pessoal apenas.', 'color:#8892a4;font-size:13px');
  console.log('%cReproduções não autorizadas estão sujeitas a medidas legais.', 'color:#8892a4;font-size:13px');
})();
</script>
</body>
</html>
